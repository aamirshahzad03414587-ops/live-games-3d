<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dark Dimension Siege">
<meta name="theme-color" content="#120820">
<title>Dark Dimension Siege · LIVE</title>
<link rel="stylesheet" href="/br/br.css">
<link rel="stylesheet" href="/siege/siege.css">
</head>
<body class="siege">
<div id="stage">
  <canvas id="gl"></canvas>
  <div id="vignette"></div>
  <canvas id="hud"></canvas>
  <div id="flash"></div>

  <div id="howto">
    <div class="title" id="howTitle">🏰 COMMENT TO JOIN!</div>
    <div class="chips" id="howChips"><span>type mage · warrior · archer · healer</span><span>❤️ likes = barrier</span></div>
  </div>
  <div id="surv">
    <div class="sl">🌍 SURVIVORS REMAINING</div>
    <div class="sn" id="svN">1,500,000,000</div>
    <div class="sb"><i id="svBar"></i></div>
  </div>
  <div id="pill"><span id="pillTxt">Connecting…</span></div>
  <div id="barrier"><div class="bt">🛡️ ASCENSION BARRIER <b id="barN">0%</b></div><div class="bar"><i id="barBar"></i></div></div>

  <div id="bossbar" hidden><div class="bn"><span id="bossName"></span> <b id="bossHpN"></b></div><div class="bar"><i id="bossHp"></i></div></div>
  <div id="vote" hidden>
    <div class="vq" id="voteQ"></div>
    <div class="vo" id="vo0"><span class="k">1</span><span class="l" id="voL0"></span><b id="voN0">0</b><i id="voB0"></i></div>
    <div class="vo" id="vo1"><span class="k">2</span><span class="l" id="voL1"></span><b id="voN1">0</b><i id="voB1"></i></div>
    <div class="vt" id="voteT"></div>
  </div>

  <div id="left">
    <div id="board" hidden><div class="bh" id="boardTitle">🛡️ TODAY'S DEFENDERS</div><ol id="boardList"></ol></div>
    <div id="feed"></div>
    <div id="toasts"></div>
  </div>

  <div id="right">
    <div class="gh">🎁 GIFT POWERS</div>
    <div id="gifts"></div>
    <div class="perk">➕ Follow = blessing</div>
    <div class="perk">🔁 Share = revive all</div>
    <div id="likes"><div class="lt">❤️ <b id="likeN">0</b>/500 pulse</div><div class="bar"><i id="likeBar"></i></div></div>
  </div>

  <div id="lore" hidden>
    <div class="lbar top"></div><div class="lbar bot"></div>
    <div class="lart" id="loreArt"><span id="loreIcon"></span></div>
    <div class="lnum" id="loreNum"></div>
    <div class="ltitle" id="loreTitle"></div>
    <div class="ltext" id="loreText"></div>
    <div class="ljoin">💬 comment to join the defense</div>
  </div>
  <div id="chapter" hidden><div class="c1" id="chN"></div><div class="c2" id="chT"></div><div class="c3" id="chB"></div></div>

  <div id="count" hidden></div>
  <div id="banner" hidden></div>
  <div id="winner" hidden><div class="w1" id="winTitle"></div><div class="ws" id="winSurv"></div><div class="w2" id="winName"></div><div class="w3" id="winSub"></div><div class="wst" id="winStory"></div></div>
  <div id="say" hidden></div>
  <button id="soundChip" hidden>🔊 Tap for sound</button>
  <div id="notice" hidden></div>
  <div id="conn" title="LIVE connection"></div>
</div>
<script src="/siege/app.js"></script>
</body>
</html>
