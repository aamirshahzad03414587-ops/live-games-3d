<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Battle Royale">
<meta name="theme-color" content="#2f7fd8">
<title>Viewer Battle Royale · LIVE</title>
<link rel="stylesheet" href="/br/br.css">
</head>
<body>
<!-- almost no text on screen: rules, gifts and events are spoken by the voice; only name tags, a timer ring and the winner's name are drawn -->
<div id="stage">
  <canvas id="gl"></canvas>
  <div id="vignette"></div>
  <canvas id="hud"></canvas>
  <div id="flash"></div>
  <div id="winner" hidden><div class="w1">👑</div><div class="w2" id="winName"></div></div>
  <button id="soundChip" hidden aria-label="Tap for sound">🔊</button>
  <div id="notice" hidden><i></i></div>
  <div id="conn" title="LIVE connection"></div>
</div>
<script src="/br/app.js"></script>
</body>
</html>
