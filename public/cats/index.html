<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Cat Dance Party</title>
  <link rel="stylesheet" href="/cats/cats.css">
</head>
<body>
  <div id="stage">
    <div id="grid"></div>
    <div id="group" hidden>
      <video id="groupVid" muted playsinline webkit-playsinline loop></video>
      <div class="name" id="groupName"></div>
    </div>
    <div id="hearts" aria-hidden="true"></div>
    <button type="button" id="soundChip" hidden>♪</button>
  </div>
  <audio id="song" playsinline webkit-playsinline loop preload="auto"></audio>
  <script type="module" src="/cats/app.js"></script>
</body>
</html>
